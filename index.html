<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DELICIOUS BITES | Live Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fafafa; scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        .hero-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800; }
        
        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: flex !important; }
        body.admin-mode [contenteditable="true"] { outline: 2px dashed #ea580c; outline-offset: 4px; background: rgba(234, 88, 12, 0.05); }
        
        .menu-card-img-container { position: relative; overflow: hidden; border-radius: 1.8rem; height: 14rem; background: #f1f5f9; }
        .admin-image-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 10px; text-transform: uppercase; cursor: pointer; z-index: 10; }
        body.admin-mode .admin-image-overlay { display: flex; }
        
        #cart-sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); z-index: 100; }
        #cart-sidebar.open { transform: translateX(0); }
        
        .cat-tab.active { background: #ea580c; color: white; border-color: #ea580c; }

        /* FIXED MOBILE SCALING */
        header { position: relative; overflow: hidden; width: 100%; height: 100vh; }
        .slide { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease-in-out; width: 100%; height: 100%; }
        .slide.active { opacity: 1; }
        .hero-overlay { background: linear-gradient(to right, rgba(0,0,0,0.8) 30%, transparent 100%); }

        @media (max-width: 768px) {
            #hero-title { font-size: 3.5rem !important; line-height: 1.1; }
            #hero-desc { font-size: 0.9rem !important; max-width: 250px; }
            .slide { background-attachment: scroll; } /* Better performance for mobile */
        }

        #mobile-cart-bar {
            transform: translateY(150%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #mobile-cart-bar.visible { transform: translateY(0); }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <div class="admin-only fixed top-0 left-0 w-full bg-orange-600 text-white z-[110] p-3 shadow-xl text-center">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-4 text-xs font-bold uppercase">
            WA (91): <input type="text" id="wa-input" class="bg-orange-700 px-2 py-1 rounded outline-none w-28">
            QR URL: <input type="text" id="qr-input" class="bg-orange-700 px-2 py-1 rounded outline-none w-28 text-black">
            <div class="flex items-center gap-2 bg-orange-700 px-3 py-1 rounded">
                CAT: 
                <select id="new-item-cat" class="bg-transparent outline-none font-black cursor-pointer">
                    <option value="veg" class="text-black">VEG</option>
                    <option value="nonveg" class="text-black">NON-VEG</option>
                    <option value="dessert" class="text-black">DESSERT</option>
                </select>
            </div>
            <button onclick="addSlide()" class="bg-blue-600 px-4 py-1 rounded-full shadow-lg">+ Slide</button>
            <button onclick="manageSlides()" class="bg-indigo-600 px-4 py-1 rounded-full shadow-lg">Edit Slides</button>
            <button onclick="publishToCloud()" class="bg-black px-4 py-1 rounded-full shadow-lg">Save Changes</button>
            <button onclick="toggleAdmin()" class="opacity-70">Exit</button>
        </div>
    </div>

    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div id="admin-trigger" ondblclick="checkAdminPin()" class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white cursor-pointer">
                <i class="fas fa-utensils"></i>
            </div>
            <h1 id="site-title" class="edit-text text-xl font-black italic">DELICIOUS BITES</h1>
        </div>
        <button onclick="toggleCart()" class="hidden md:flex bg-black text-white px-6 py-2.5 rounded-full font-bold text-sm items-center gap-2">
            <i class="fas fa-shopping-bag"></i> <span id="nav-cart-count">0</span>
        </button>
    </nav>

    <header id="hero-slider" class="min-h-screen flex items-center pt-16">
        <div id="slides-container" class="absolute inset-0"></div>
        <div class="hero-overlay absolute inset-0 z-10"></div>
        <div class="relative z-20 p-8 lg:p-24 text-white">
            <h2 id="hero-title" class="edit-text text-5xl md:text-8xl hero-title mb-6 leading-tight">Tasty <br> Memories.</h2>
            <p id="hero-desc" class="edit-text text-slate-300 font-medium mb-12 max-w-sm">Handcrafted snacks. Delivered to your door.</p>
            <div><a href="#menu" class="bg-orange-600 text-white px-10 py-4 rounded-2xl font-black inline-block shadow-xl">Start Ordering</a></div>
        </div>
    </header>

    <section id="menu" class="max-w-7xl mx-auto px-6 py-24 pb-40">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-16">
            <h3 class="text-4xl md:text-5xl font-black italic">Menu</h3>
            <div class="flex bg-slate-100 p-1.5 rounded-2xl gap-1 overflow-x-auto max-w-full">
                <button onclick="filterCat('all')" id="cat-all" class="cat-tab active px-5 py-2 rounded-xl font-bold text-[10px] uppercase whitespace-nowrap">All</button>
                <button onclick="filterCat('veg')" id="cat-veg" class="cat-tab px-5 py-2 rounded-xl font-bold text-[10px] uppercase whitespace-nowrap">Veg</button>
                <button onclick="filterCat('nonveg')" id="cat-nonveg" class="cat-tab px-5 py-2 rounded-xl font-bold text-[10px] uppercase whitespace-nowrap">Non-Veg</button>
                <button onclick="filterCat('dessert')" id="cat-dessert" class="cat-tab px-5 py-2 rounded-xl font-bold text-[10px] uppercase whitespace-nowrap">Desserts</button>
            </div>
            <button onclick="addNewDish()" class="admin-only bg-green-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg">+ Add Item</button>
        </div>
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </section>

    <div id="mobile-cart-bar" class="fixed bottom-6 left-6 right-6 z-50 md:bottom-8 md:left-auto md:right-8 md:w-80">
        <button onclick="toggleCart()" class="w-full bg-orange-600 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center hover:bg-orange-700 transition-colors">
            <div class="flex items-center gap-3">
                <span id="mobile-cart-count" class="bg-white/20 w-8 h-8 flex items-center justify-center rounded-lg font-black text-sm">0</span>
                <span class="font-bold text-sm tracking-tight">View your cart</span>
            </div>
            <span class="font-black text-lg">&#8377;<span id="mobile-cart-total">0</span> <i class="fas fa-chevron-right ml-2 text-xs opacity-50"></i></span>
        </button>
    </div>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-white sticky top-0 z-10">
            <h4 class="text-2xl font-black italic">Your Order</h4>
            <button onclick="toggleCart()" class="text-slate-300 text-4xl leading-none">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto p-6 space-y-6">
            <div id="cart-items" class="space-y-4"></div>
            <div class="space-y-3 pt-4">
                <input type="text" id="cust-name" placeholder="Full Name" class="w-full p-4 rounded-xl bg-slate-100 font-bold text-sm outline-none border-2 border-transparent focus:border-orange-500">
                <textarea id="cust-addr" placeholder="Full Delivery Address" class="w-full p-4 rounded-xl bg-slate-100 font-bold text-sm h-24 outline-none border-2 border-transparent focus:border-orange-500"></textarea>
                
                <div class="flex gap-2 p-1 bg-slate-100 rounded-xl">
                    <button id="pay-cod" onclick="setPayment('COD')" class="flex-1 py-3 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm text-orange-600">COD</button>
                    <button id="pay-online" onclick="setPayment('PREPAID')" class="flex-1 py-3 rounded-lg font-black text-[10px] uppercase text-slate-400">Prepaid</button>
                </div>

                <div id="qr-container" class="hidden pt-4 flex flex-col items-center">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-2">Scan to Pay</p>
                    <img id="payment-qr" src="" class="w-48 h-48 rounded-xl border-4 border-slate-100">
                </div>
            </div>
        </div>
        <div class="p-6 border-t bg-slate-50">
            <div class="flex justify-between items-center mb-6">
                <span class="font-bold text-slate-400 text-xs uppercase tracking-widest">Grand Total</span>
                <span class="text-3xl font-black text-orange-600 italic">
                    &#8377;<span id="cart-total" class="edit-text">0</span>
                </span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-transform">PLACE ORDER VIA WHATSAPP</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAnhMKWxrGBDgLpLw42LIAvgj7neFhaO7g",
            databaseURL: "https://delisious-bites-default-rtdb.firebaseio.com/",
            projectId: "delisious-bites",
            appId: "1:502060863330:web:265ed82af0aed3d772263b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let siteData = { wa: "9100000000", qr: "", title: "DELICIOUS BITES", menu: [], heroTitle: "Tasty Memories.", heroDesc: "Handcrafted snacks.", slides: ["https://images.unsplash.com/photo-1601050690597-df056fb0179a?w=1200"] };
        let cart = [];
        let currentFilter = 'all';
        let slideIndex = 0;
        let paymentMethod = 'COD';

        db.ref('siteData').on('value', (snap) => {
            if (snap.exists()) { 
                siteData = snap.val(); 
                if(!siteData.menu) siteData.menu = [];
                if(!siteData.slides) siteData.slides = ["https://images.unsplash.com/photo-1601050690597-df056fb0179a?w=1200"];
                applyDataToScreen(); 
            }
        });

        function applyDataToScreen() {
            document.getElementById('site-title').innerText = siteData.title;
            document.getElementById('hero-title').innerText = siteData.heroTitle;
            document.getElementById('hero-desc').innerText = siteData.heroDesc;
            document.getElementById('wa-input').value = siteData.wa;
            document.getElementById('qr-input').value = siteData.qr;
            document.getElementById('payment-qr').src = siteData.qr;
            renderSlides();
            renderMenu();
        }

        function setPayment(m) {
            paymentMethod = m;
            document.getElementById('pay-cod').className = m === 'COD' ? 'flex-1 py-3 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm text-orange-600' : 'flex-1 py-3 rounded-lg font-black text-[10px] uppercase text-slate-400';
            document.getElementById('pay-online').className = m === 'PREPAID' ? 'flex-1 py-3 rounded-lg font-black text-[10px] uppercase bg-white shadow-sm text-orange-600' : 'flex-1 py-3 rounded-lg font-black text-[10px] uppercase text-slate-400';
            document.getElementById('qr-container').classList.toggle('hidden', m !== 'PREPAID');
        }

        function renderSlides() {
            const container = document.getElementById('slides-container');
            container.innerHTML = '';
            siteData.slides.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = `slide ${i === 0 ? 'active' : ''}`;
                div.style.backgroundImage = `url('${url}')`;
                container.appendChild(div);
            });
            startSlideshow();
        }

        function startSlideshow() {
            clearInterval(window.slideTimer);
            window.slideTimer = setInterval(() => {
                const slides = document.querySelectorAll('.slide');
                if (slides.length <= 1) return;
                slides[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % slides.length;
                slides[slideIndex].classList.add('active');
            }, 5000);
        }

        function addSlide() {
            const url = prompt("Enter Image URL for new slide:");
            if(url) { siteData.slides.push(url); renderSlides(); }
        }

        function manageSlides() {
            let list = "Slides (d[index] to delete, [index] to change):\n";
            siteData.slides.forEach((s, i) => list += `${i}: ${s.substring(0, 20)}...\n`);
            const action = prompt(list);
            if (action) {
                if (action.startsWith('d')) {
                    const idx = parseInt(action.substring(1));
                    if (siteData.slides.length > 1) siteData.slides.splice(idx, 1);
                } else {
                    const idx = parseInt(action);
                    const newUrl = prompt("New URL:", siteData.slides[idx]);
                    if(newUrl) siteData.slides[idx] = newUrl;
                }
                renderSlides();
            }
        }

        function checkAdminPin() { if(prompt("Admin PIN:") === "5566") toggleAdmin(); }
        function toggleAdmin() {
            const mode = document.body.classList.toggle('admin-mode');
            document.querySelectorAll('.edit-text').forEach(el => el.contentEditable = mode);
            renderMenu();
        }

        function filterCat(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById('cat-' + cat).classList.add('active');
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid'); grid.innerHTML = '';
            const isAdmin = document.body.classList.contains('admin-mode');
            siteData.menu.forEach((item, i) => {
                const itemCat = item.category || 'veg'; 
                if(currentFilter !== 'all' && itemCat !== currentFilter) return;
                const catLabel = itemCat === 'veg' ? 'VEG' : (itemCat === 'nonveg' ? 'NON-VEG' : 'DESSERT');
                const catColor = itemCat === 'veg' ? 'text-green-600' : (itemCat === 'nonveg' ? 'text-red-600' : 'text-purple-600');
                const cartItem = cart.find(c => c.originalIndex === i);
                const quantity = cartItem ? cartItem.quantity : 0;
                grid.innerHTML += `
                    <div class="bg-white rounded-[2.5rem] p-4 border border-slate-100 shadow-sm relative text-left">
                        <div class="menu-card-img-container">
                            <img src="${item.img}" class="w-full h-full object-cover">
                            <div onclick="changeItemImg(${i})" class="admin-image-overlay">Replace Photo</div>
                        </div>
                        <div class="mt-5 px-2">
                             <p class="text-[9px] font-black uppercase tracking-widest ${catColor} mb-1">${catLabel}</p>
                             <h4 contenteditable="${isAdmin}" onblur="siteData.menu[${i}].name=this.innerText" class="text-lg font-black leading-tight">${item.name}</h4>
                        </div>
                        <div class="flex justify-between items-center mt-4 px-2">
                            <span class="text-xl font-black text-orange-600">&#8377;<span contenteditable="${isAdmin}" onblur="siteData.menu[${i}].price=this.innerText">${item.price.replace('?', '')}</span></span>
                            <div class="relative w-24 h-9">
                                <button onclick="handleInitialAdd(${i})" class="${quantity > 0 ? 'hidden' : 'flex'} absolute inset-0 bg-white border border-slate-200 text-orange-600 font-bold rounded-lg items-center justify-center shadow-sm text-[10px] uppercase">Add</button>
                                <div class="${quantity > 0 ? 'flex' : 'hidden'} absolute inset-0 bg-orange-600 text-white rounded-lg items-center justify-between px-2 shadow-lg">
                                    <button onclick="changeQty(${i}, -1)" class="w-6 h-6 flex items-center justify-center font-bold">-</button>
                                    <span class="font-bold text-xs">${quantity}</span>
                                    <button onclick="changeQty(${i}, 1)" class="w-6 h-6 flex items-center justify-center font-bold">+</button>
                                </div>
                            </div>
                        </div>
                        <button onclick="siteData.menu.splice(${i},1);renderMenu()" class="admin-only absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">×</button>
                    </div>`;
            });
        }

        function handleInitialAdd(index) {
            cart.push({ ...siteData.menu[index], quantity: 1, originalIndex: index });
            updateCart(); renderMenu();
        }

        function changeQty(originalIndex, delta) {
            const idx = cart.findIndex(c => c.originalIndex === originalIndex);
            if (idx > -1) {
                cart[idx].quantity += delta;
                if (cart[idx].quantity <= 0) cart.splice(idx, 1);
            }
            updateCart(); renderMenu();
        }

        function updateCart() {
            const list = document.getElementById('cart-items'); 
            const mobileBar = document.getElementById('mobile-cart-bar');
            let total = 0, totalItems = 0; list.innerHTML = '';
            
            cart.forEach((item, i) => {
                const priceNum = parseInt(item.price.replace(/[^0-9]/g, '')) || 0;
                total += (priceNum * item.quantity); totalItems += item.quantity;
                list.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                    <div class="pr-2"><p class="font-bold text-xs uppercase">${item.name}</p><p class="text-[10px] text-slate-400 font-bold">${item.quantity} x &#8377;${item.price.replace('?', '')}</p></div>
                    <button onclick="removeCompletely(${i})" class="text-red-400 font-black px-2 text-xl">&times;</button>
                </div>`;
            });

            document.getElementById('cart-total').innerText = total;
            document.getElementById('mobile-cart-total').innerText = total;
            document.getElementById('nav-cart-count').innerText = totalItems;
            document.getElementById('mobile-cart-count').innerText = totalItems;

            if (totalItems > 0) mobileBar.classList.add('visible');
            else mobileBar.classList.remove('visible');
        }

        function removeCompletely(idx) { cart.splice(idx, 1); updateCart(); renderMenu(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }
        function addNewDish() { 
            const cat = document.getElementById('new-item-cat').value;
            siteData.menu.unshift({ name: "New Dish", price: "150", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400", category: cat }); 
            renderMenu(); 
        }

        function publishToCloud() {
            siteData.title = document.getElementById('site-title').innerText;
            siteData.heroTitle = document.getElementById('hero-title').innerText;
            siteData.heroDesc = document.getElementById('hero-desc').innerText;
            siteData.wa = document.getElementById('wa-input').value;
            siteData.qr = document.getElementById('qr-input').value;
            db.ref('siteData').set(siteData).then(() => alert("Saved!"));
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-addr').value;
            const grandTotal = document.getElementById('cart-total').innerText;
            if(!name || !addr || !cart.length) return alert("Fill details!");
            let msg = `*NEW ORDER*%0A*Name:* ${name}%0A*Address:* ${addr}%0A*Payment:* ${paymentMethod}%0A%0A*Items:*%0A`;
            cart.forEach(item => msg += `• ${item.name} (${item.quantity} x Rs.${item.price.replace('?', '')})%0A`);
            msg += `%0A*Total: Rs. ${grandTotal}*`;
            window.open(`https://wa.me/${siteData.wa}?text=${msg}`, '_blank');
        }

        function changeItemImg(i) { const u = prompt("Img URL:"); if(u) { siteData.menu[i].img = u; renderMenu(); } }
    </script>
</body>
</html>

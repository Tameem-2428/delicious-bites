<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELICIOUS BITES | Live Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fafafa; scroll-behavior: smooth; }
        .hero-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800; }
        
        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: flex !important; }

        body.admin-mode [contenteditable="true"] { outline: 2px dashed #ea580c; outline-offset: 4px; background: rgba(234, 88, 12, 0.05); }
        
        .menu-card-img-container {
            position: relative;
            overflow: hidden;
            border-radius: 1.8rem;
            height: 14rem;
            background: #f1f5f9;
        }

        .admin-image-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 10px;
            text-transform: uppercase;
            cursor: pointer;
            z-index: 10;
        }
        body.admin-mode .admin-image-overlay { display: flex; }

        #gear-btn { display: none; }
        #cart-sidebar { transition: transform 0.4s ease; transform: translateX(100%); z-index: 50; }
        #cart-sidebar.open { transform: translateX(0); }
        .payment-pill.active { background: #ea580c; color: white; border-color: #ea580c; }
        #admin-trigger { cursor: pointer; user-select: none; }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <div class="admin-only fixed top-0 left-0 w-full bg-orange-600 text-white z-[100] p-3 shadow-xl text-center">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-4 text-xs font-bold uppercase">
            WA (91): <input type="text" id="wa-input" class="bg-orange-700 px-2 py-1 rounded outline-none w-28">
            QR URL: <input type="text" id="qr-input" class="bg-orange-700 px-2 py-1 rounded outline-none w-28 text-black">
            <button onclick="publishToCloud()" class="bg-black px-4 py-1 rounded-full shadow-lg">Save All Changes</button>
            <button onclick="toggleAdmin()" class="opacity-70">Exit Admin</button>
        </div>
    </div>

    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div id="admin-trigger" ondblclick="checkAdminPin()" class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white">
                <i class="fas fa-utensils"></i>
            </div>
            <h1 id="site-title" class="edit-text text-xl font-black italic">DELICIOUS BITES</h1>
        </div>
        <div class="flex items-center gap-3">
            <button id="gear-btn" onclick="toggleAdmin()" class="p-3 text-orange-600 bg-orange-50 rounded-full"><i class="fas fa-cog text-xl"></i></button>
            <button onclick="toggleCart()" class="bg-black text-white px-6 py-2.5 rounded-full font-bold text-sm flex items-center gap-2 relative">
                <i class="fas fa-shopping-bag"></i> <span id="cart-count">0</span>
            </button>
        </div>
    </nav>

    <header class="min-h-screen grid lg:grid-cols-2 pt-16">
        <div class="bg-slate-950 text-white p-12 lg:p-24 flex flex-col justify-center">
            <h2 id="hero-title" class="edit-text text-6xl md:text-8xl hero-title mb-6 leading-tight">Tasty <br> Memories.</h2>
            <p id="hero-desc" class="edit-text text-slate-500 font-medium mb-12 max-w-sm">Handcrafted snacks. Delivered to your door.</p>
            <div><a href="#menu" class="bg-orange-600 text-white px-10 py-4 rounded-2xl font-black inline-block shadow-xl">Start Ordering</a></div>
        </div>
        <div class="relative h-full min-h-[400px]">
            <img id="hero-img" src="https://images.unsplash.com/photo-1601050690597-df056fb0179a?w=1200" class="w-full h-full object-cover">
            <div onclick="changeHeroImg()" class="admin-image-overlay">Update Hero Photo</div>
        </div>
    </header>

    <section id="menu" class="max-w-7xl mx-auto px-6 py-24">
        <div class="flex justify-between items-end mb-16">
            <h3 class="text-5xl font-black italic">Menu</h3>
            <button onclick="addNewDish()" class="admin-only bg-green-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg">+ Add Item</button>
        </div>
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
    </section>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
        <div class="p-8 border-b flex justify-between items-center">
            <h4 id="label-your-order" class="edit-text text-2xl font-black italic">Your Order</h4>
            <button onclick="toggleCart()" class="text-slate-300 text-4xl">&times;</button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div id="cart-items" class="space-y-4"></div>
            
            <div class="space-y-3 pt-4">
                <input type="text" id="cust-name" placeholder="Full Name" class="w-full p-4 rounded-xl bg-slate-100 font-bold text-sm outline-none">
                <textarea id="cust-addr" placeholder="Full Delivery Address" class="w-full p-4 rounded-xl bg-slate-100 font-bold text-sm h-20 outline-none"></textarea>
            </div>

            <div class="space-y-4 pt-4">
                <p id="label-payment-method" class="edit-text text-[10px] font-black uppercase text-slate-400">Payment</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="setPayment('Online')" id="pay-online" class="payment-pill active border-2 border-slate-100 py-3 rounded-2xl font-bold text-sm">Online (QR)</button>
                    <button onclick="setPayment('COD')" id="pay-cod" class="payment-pill border-2 border-slate-100 py-3 rounded-2xl font-bold text-sm">Cash (COD)</button>
                </div>
            </div>

            <div id="qr-section" class="flex flex-col items-center py-6 border-2 border-dashed border-orange-200 rounded-3xl bg-orange-50/30">
                <img id="display-qr" src="" class="w-40 h-40 bg-white p-2 rounded-xl">
                <p id="label-scan-pay" class="edit-text text-[9px] text-slate-400 mt-4 font-black uppercase text-center">Scan to Pay</p>
            </div>
        </div>

        <div class="p-8 border-t bg-slate-50">
            <div class="space-y-2 mb-4">
                <div class="flex justify-between text-xs font-bold text-slate-400 uppercase">
                    <span id="label-subtotal" class="edit-text">Subtotal</span>
                    <span>&#8377;<span id="subtotal">0</span></span>
                </div>
                <div class="flex justify-between text-xs font-bold uppercase">
                    <span><span id="label-delivery" class="edit-text">Delivery</span> <span id="delivery-note" class="text-[10px] lowercase font-medium"></span></span>
                    <span id="delivery-cost-text">&#8377;0</span>
                </div>
                <hr class="border-slate-200 my-2">
                <div class="flex justify-between items-center">
                    <span id="label-grand-total" class="edit-text font-bold text-slate-900 text-xs uppercase">Grand Total</span>
                    <span class="text-3xl font-black text-orange-600">&#8377;<span id="cart-total">0</span></span>
                </div>
            </div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">PLACE ORDER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAnhMKWxrGBDgLpLw42LIAvgj7neFhaO7g",
            databaseURL: "https://delisious-bites-default-rtdb.firebaseio.com/",
            projectId: "delisious-bites",
            appId: "1:502060863330:web:265ed82af0aed3d772263b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let siteData = { 
            wa: "9100000000", qr: "", title: "DELICIOUS BITES", heroTitle: "Tasty Memories.", heroDesc: "Handcrafted snacks.", heroImg: "https://images.unsplash.com/photo-1601050690597-df056fb0179a?w=1200", menu: [],
            labels: { order: "Your Order", payMethod: "Payment", scanPay: "Scan to Pay", sub: "Subtotal", del: "Delivery", grand: "Grand Total" }
        };
        let cart = [];
        let paymentMethod = 'Online';

        db.ref('siteData').on('value', (snap) => {
            if (snap.exists()) { 
                siteData = snap.val(); 
                applyDataToScreen(); 
            }
        });

        function applyDataToScreen() {
            document.getElementById('site-title').innerText = siteData.title;
            document.getElementById('hero-title').innerText = siteData.heroTitle;
            document.getElementById('hero-desc').innerText = siteData.heroDesc;
            document.getElementById('hero-img').src = siteData.heroImg;
            document.getElementById('wa-input').value = siteData.wa;
            document.getElementById('qr-input').value = siteData.qr;
            document.getElementById('display-qr').src = siteData.qr;
            renderMenu();
        }

        function checkAdminPin() {
            if(prompt("Enter Admin PIN:") === "5566") { toggleAdmin(); document.getElementById('gear-btn').style.display = 'block'; }
        }

        function toggleAdmin() {
            const mode = document.body.classList.toggle('admin-mode');
            document.querySelectorAll('.edit-text').forEach(el => el.contentEditable = mode);
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid'); grid.innerHTML = '';
            const isAdmin = document.body.classList.contains('admin-mode');
            if(!siteData.menu) siteData.menu = [];
            siteData.menu.forEach((item, i) => {
                grid.innerHTML += `
                    <div class="bg-white rounded-[2.5rem] p-5 border border-slate-100 shadow-sm relative">
                        <div class="menu-card-img-container">
                            <img src="${item.img}" class="w-full h-full object-cover">
                            <div onclick="changeItemImg(${i})" class="admin-image-overlay">Replace Img</div>
                        </div>
                        <h4 contenteditable="${isAdmin}" onblur="siteData.menu[${i}].name=this.innerText" class="text-xl font-black px-2 mt-6">${item.name}</h4>
                        <div class="flex justify-between items-center mt-6 px-2">
                            <span contenteditable="${isAdmin}" onblur="siteData.menu[${i}].price=this.innerText" class="text-2xl font-black text-orange-600">${item.price}</span>
                            <button onclick="addToCart(${i})" class="bg-black text-white w-12 h-12 rounded-2xl active:scale-90 flex items-center justify-center"><i class="fas fa-plus"></i></button>
                        </div>
                        <button onclick="siteData.menu.splice(${i},1);renderMenu()" class="admin-only absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full shadow-lg flex items-center justify-center font-bold">×</button>
                    </div>`;
            });
        }

        function publishToCloud() {
            siteData.title = document.getElementById('site-title').innerText;
            siteData.heroTitle = document.getElementById('hero-title').innerText;
            siteData.heroDesc = document.getElementById('hero-desc').innerText;
            siteData.wa = document.getElementById('wa-input').value;
            siteData.qr = document.getElementById('qr-input').value;
            db.ref('siteData').set(siteData).then(() => alert("Saved Successfully!"));
        }

        function changeHeroImg() { if(document.body.classList.contains('admin-mode')) { const u = prompt("Img URL:"); if(u) { siteData.heroImg = u; applyDataToScreen(); } } }
        function changeItemImg(i) { if(document.body.classList.contains('admin-mode')) { const u = prompt("Img URL:"); if(u) { siteData.menu[i].img = u; renderMenu(); } } }
        function addNewDish() { siteData.menu.unshift({name:"New Dish", price:"&#8377;150", img:"https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400"}); renderMenu(); }
        function addToCart(i) { cart.push(siteData.menu[i]); updateCart(); toggleCart(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }
        function setPayment(method) { paymentMethod = method; document.getElementById('pay-online').classList.toggle('active', method === 'Online'); document.getElementById('pay-cod').classList.toggle('active', method === 'COD'); document.getElementById('qr-section').style.display = (method === 'Online') ? 'flex' : 'none'; }

        function updateCart() {
            const list = document.getElementById('cart-items'); let itemsTotal = 0; list.innerHTML = '';
            cart.forEach((item, i) => {
                itemsTotal += parseInt(item.price.replace(/[^0-9]/g, '')) || 0;
                list.innerHTML += `<div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl border border-slate-100"><span class="font-bold text-xs uppercase text-black">${item.name}</span><button onclick="cart.splice(${i},1);updateCart()" class="text-red-400 font-black px-2">×</button></div>`;
            });
            let deliveryCharge = 0; let noteText = "";
            if (cart.length > 0) { if (cart.length < 5) { deliveryCharge = 100; noteText = `(add ${5 - cart.length} more for free)`; } else { deliveryCharge = 0; noteText = "(free applied!)"; } }
            document.getElementById('delivery-note').innerText = noteText;
            document.getElementById('delivery-cost-text').innerHTML = (cart.length >= 5) ? `FREE` : `&#8377;${deliveryCharge}`;
            document.getElementById('subtotal').innerText = itemsTotal;
            document.getElementById('cart-total').innerText = itemsTotal + deliveryCharge;
            document.getElementById('cart-count').innerText = cart.length;
        }

        function sendOrder() {
            const addressField = document.getElementById('cust-addr');
            const name = document.getElementById('cust-name').value;
            if(!name || !addressField.value || !cart.length) return alert("Please fill your name, address, and add items!");
            
            let msg = `*?? ORDER - ${siteData.title}*%0A*Name:* ${name}%0A*Address:* ${addressField.value}%0A*Payment:* ${paymentMethod}%0A%0A*Items:*%0A`;
            cart.forEach(item => msg += ` ${item.name} (${item.price.replace('&#8377;', 'Rs. ')})%0A`);
            msg += `%0A*TOTAL: Rs. ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/${siteData.wa}?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DELICIOUS BITES | Live Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fafafa; scroll-behavior: smooth; }
        .hero-title { font-family: 'Playfair Display', serif; font-style: italic; font-weight: 800; }
        .admin-only { display: none !important; }
        body.admin-mode .admin-only { display: flex !important; }
        body.admin-mode [contenteditable="true"] { outline: 2px dashed #ea580c; outline-offset: 4px; background: rgba(234, 88, 12, 0.05); }
        .menu-card-img-container { position: relative; overflow: hidden; border-radius: 1.8rem; height: 14rem; background: #f1f5f9; }
        .admin-image-overlay { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.4); align-items: center; justify-content: center; color: white; font-weight: 900; font-size: 10px; text-transform: uppercase; cursor: pointer; z-index: 10; }
        body.admin-mode .admin-image-overlay { display: flex; }
        #cart-sidebar { transition: transform 0.4s ease; transform: translateX(100%); z-index: 50; }
        #cart-sidebar.open { transform: translateX(0); }
        .cat-tab.active { background: #ea580c; color: white; border-color: #ea580c; }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden">

    <div class="admin-only fixed top-0 left-0 w-full bg-orange-600 text-white z-[100] p-3 shadow-xl text-center">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-center items-center gap-4 text-xs font-bold uppercase">
            WA (91): <input type="text" id="wa-input" class="bg-orange-700 px-2 py-1 rounded outline-none w-28">
            QR URL: <input type="text" id="qr-input" class="bg-orange-700 px-2 py-1 rounded outline-none w-28 text-black">
            <div class="flex items-center gap-2 bg-orange-700 px-3 py-1 rounded">
                ADD AS: 
                <select id="new-item-cat" class="bg-transparent outline-none font-black cursor-pointer">
                    <option value="veg" class="text-black">VEG</option>
                    <option value="nonveg" class="text-black">NON-VEG</option>
                    <option value="dessert" class="text-black">DESSERT</option>
                </select>
            </div>
            <button onclick="publishToCloud()" class="bg-black px-4 py-1 rounded-full shadow-lg">Save All Changes</button>
            <button onclick="toggleAdmin()" class="opacity-70">Exit Admin</button>
        </div>
    </div>

    <nav class="fixed top-0 w-full z-40 bg-white/80 backdrop-blur-md px-6 py-4 flex justify-between items-center border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div id="admin-trigger" ondblclick="checkAdminPin()" class="w-10 h-10 bg-orange-600 rounded-xl flex items-center justify-center text-white cursor-pointer">
                <i class="fas fa-utensils"></i>
            </div>
            <h1 id="site-title" class="edit-text text-xl font-black italic">DELICIOUS BITES</h1>
        </div>
        <button onclick="toggleCart()" class="bg-black text-white px-6 py-2.5 rounded-full font-bold text-sm flex items-center gap-2 relative">
            <i class="fas fa-shopping-bag"></i> <span id="cart-count">0</span>
        </button>
    </nav>

    <header class="min-h-screen grid lg:grid-cols-2 pt-16">
        <div class="bg-slate-950 text-white p-12 lg:p-24 flex flex-col justify-center">
            <h2 id="hero-title" class="edit-text text-6xl md:text-8xl hero-title mb-6 leading-tight">Tasty <br> Memories.</h2>
            <p id="hero-desc" class="edit-text text-slate-500 font-medium mb-12 max-w-sm">Handcrafted snacks. Delivered to your door.</p>
            <div><a href="#menu" class="bg-orange-600 text-white px-10 py-4 rounded-2xl font-black inline-block shadow-xl">Start Ordering</a></div>
        </div>
        <div class="relative h-full min-h-[400px]">
            <img id="hero-img" src="https://images.unsplash.com/photo-1601050690597-df056fb0179a?w=1200" class="w-full h-full object-cover">
            <div onclick="changeHeroImg()" class="admin-image-overlay">Update Hero Photo</div>
        </div>
    </header>

    <section id="menu" class="max-w-7xl mx-auto px-6 py-24">
        <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-16">
            <h3 class="text-5xl font-black italic">Menu</h3>
            <div class="flex bg-slate-100 p-1.5 rounded-2xl gap-1">
                <button onclick="filterCat('all')" id="cat-all" class="cat-tab active px-6 py-2 rounded-xl font-bold text-xs uppercase transition-all">All</button>
                <button onclick="filterCat('veg')" id="cat-veg" class="cat-tab px-6 py-2 rounded-xl font-bold text-xs uppercase transition-all">Veg</button>
                <button onclick="filterCat('nonveg')" id="cat-nonveg" class="cat-tab px-6 py-2 rounded-xl font-bold text-xs uppercase transition-all">Non-Veg</button>
                <button onclick="filterCat('dessert')" id="cat-dessert" class="cat-tab px-6 py-2 rounded-xl font-bold text-xs uppercase transition-all">Desserts</button>
            </div>
            <button onclick="addNewDish()" class="admin-only bg-green-600 text-white px-6 py-2 rounded-xl font-bold shadow-lg">+ Add Item</button>
        </div>
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12"></div>
    </section>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
        <div class="p-8 border-b flex justify-between items-center">
            <h4 class="text-2xl font-black italic">Your Order</h4>
            <button onclick="toggleCart()" class="text-slate-300 text-4xl">&times;</button>
        </div>
        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div id="cart-items" class="space-y-4"></div>
            <div class="space-y-3 pt-4 px-8">
                <input type="text" id="cust-name" placeholder="Full Name" class="w-full p-4 rounded-xl bg-slate-100 font-bold text-sm outline-none">
                <textarea id="cust-addr" placeholder="Full Delivery Address" class="w-full p-4 rounded-xl bg-slate-100 font-bold text-sm h-20 outline-none"></textarea>
            </div>
        </div>
        <div class="p-8 border-t bg-slate-50">
            <div class="flex justify-between items-center mb-6">
                <span class="font-bold text-slate-900 text-xs uppercase">Grand Total</span>
                <span class="text-3xl font-black text-orange-600">&#8377;<span id="cart-total">0</span></span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-green-600 text-white py-5 rounded-2xl font-black text-lg shadow-lg">PLACE ORDER</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAnhMKWxrGBDgLpLw42LIAvgj7neFhaO7g",
            databaseURL: "https://delisious-bites-default-rtdb.firebaseio.com/",
            projectId: "delisious-bites",
            appId: "1:502060863330:web:265ed82af0aed3d772263b"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let siteData = { wa: "9100000000", qr: "", title: "DELICIOUS BITES", menu: [] };
        let cart = []; // We'll store objects: { name, price, quantity, originalIndex }
        let currentFilter = 'all';

        db.ref('siteData').on('value', (snap) => {
            if (snap.exists()) { 
                siteData = snap.val(); 
                if(!siteData.menu) siteData.menu = [];
                applyDataToScreen(); 
            }
        });

        function applyDataToScreen() {
            document.getElementById('site-title').innerText = siteData.title;
            document.getElementById('hero-title').innerText = siteData.heroTitle;
            document.getElementById('hero-desc').innerText = siteData.heroDesc;
            document.getElementById('hero-img').src = siteData.heroImg;
            document.getElementById('wa-input').value = siteData.wa;
            document.getElementById('qr-input').value = siteData.qr;
            renderMenu();
        }

        function checkAdminPin() { if(prompt("Enter Admin PIN:") === "5566") { toggleAdmin(); } }
        function toggleAdmin() {
            const mode = document.body.classList.toggle('admin-mode');
            document.querySelectorAll('.edit-text').forEach(el => el.contentEditable = mode);
            renderMenu();
        }

        function filterCat(cat) {
            currentFilter = cat;
            document.querySelectorAll('.cat-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById('cat-' + cat).classList.add('active');
            renderMenu();
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid'); grid.innerHTML = '';
            const isAdmin = document.body.classList.contains('admin-mode');
            
            siteData.menu.forEach((item, i) => {
                const itemCat = item.category || 'veg'; 
                if(currentFilter !== 'all' && itemCat !== currentFilter) return;

                const catLabel = itemCat === 'veg' ? 'VEG' : (itemCat === 'nonveg' ? 'NON-VEG' : 'DESSERT');
                const catColor = itemCat === 'veg' ? 'text-green-600' : (itemCat === 'nonveg' ? 'text-red-600' : 'text-purple-600');
                
                // Check if item is already in cart to show Qty Bar or ADD button
                const cartItem = cart.find(c => c.originalIndex === i);
                const quantity = cartItem ? cartItem.quantity : 0;

                grid.innerHTML += `
                    <div class="bg-white rounded-[2.5rem] p-5 border border-slate-100 shadow-sm relative text-left">
                        <div class="menu-card-img-container">
                            <img src="${item.img}" class="w-full h-full object-cover">
                            <div onclick="changeItemImg(${i})" class="admin-image-overlay">Replace Img</div>
                        </div>
                        <div class="mt-6 px-2">
                             <p class="text-[10px] font-black uppercase tracking-widest ${catColor} mb-1">${catLabel}</p>
                             <h4 contenteditable="${isAdmin}" onblur="siteData.menu[${i}].name=this.innerText" class="text-xl font-black">${item.name}</h4>
                        </div>
                        <div class="flex justify-between items-center mt-4 px-2">
                            <span contenteditable="${isAdmin}" onblur="siteData.menu[${i}].price=this.innerText" class="text-2xl font-black text-orange-600">${item.price}</span>
                            
                            <div class="relative w-28 h-10">
                                <button onclick="handleInitialAdd(${i})" 
                                    class="${quantity > 0 ? 'hidden' : 'flex'} absolute inset-0 bg-white border border-slate-200 text-orange-600 font-bold rounded-xl items-center justify-center shadow-sm active:scale-95 transition-all uppercase text-xs">
                                    Add
                                </button>
                                
                                <div class="${quantity > 0 ? 'flex' : 'hidden'} absolute inset-0 bg-orange-600 text-white rounded-xl items-center justify-between px-2 shadow-lg">
                                    <button onclick="changeQty(${i}, -1)" class="w-6 h-6 flex items-center justify-center font-bold text-lg">-</button>
                                    <span class="font-bold text-sm">${quantity}</span>
                                    <button onclick="changeQty(${i}, 1)" class="w-6 h-6 flex items-center justify-center font-bold text-lg">+</button>
                                </div>
                            </div>
                        </div>
                        <button onclick="siteData.menu.splice(${i},1);renderMenu()" class="admin-only absolute -top-2 -right-2 bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">×</button>
                    </div>`;
            });
        }

        // Domino's Style: First click adds 1 and reveals bar
        function handleInitialAdd(index) {
            const item = siteData.menu[index];
            cart.push({ ...item, quantity: 1, originalIndex: index });
            updateCart();
            renderMenu();
        }

        // Domino's Style: Plus/Minus updates cart immediately
        function changeQty(originalIndex, delta) {
            const cartItemIndex = cart.findIndex(c => c.originalIndex === originalIndex);
            if (cartItemIndex > -1) {
                cart[cartItemIndex].quantity += delta;
                if (cart[cartItemIndex].quantity <= 0) {
                    cart.splice(cartItemIndex, 1); // Remove if 0
                }
            }
            updateCart();
            renderMenu();
        }

        function updateCart() {
            const list = document.getElementById('cart-items'); 
            let total = 0; 
            let totalItems = 0;
            list.innerHTML = '';

            cart.forEach((item, i) => {
                const priceNum = parseInt(item.price.replace(/[^0-9]/g, '')) || 0;
                total += (priceNum * item.quantity);
                totalItems += item.quantity;

                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl mx-8">
                        <div>
                            <p class="font-bold text-xs uppercase">${item.name}</p>
                            <p class="text-[10px] text-slate-400 font-bold">${item.quantity} x ${item.price}</p>
                        </div>
                        <button onclick="removeCompletely(${i})" class="text-red-400 font-black px-2">×</button>
                    </div>`;
            });
            document.getElementById('cart-total').innerText = total;
            document.getElementById('cart-count').innerText = totalItems;
        }

        function removeCompletely(cartIndex) {
            cart.splice(cartIndex, 1);
            updateCart();
            renderMenu();
        }

        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); }

        function addNewDish() { 
            const cat = document.getElementById('new-item-cat').value;
            siteData.menu.unshift({ name: "New Dish", price: "₹150", img: "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400", category: cat }); 
            renderMenu(); 
        }

        function publishToCloud() {
            siteData.title = document.getElementById('site-title').innerText;
            siteData.heroTitle = document.getElementById('hero-title').innerText;
            siteData.heroDesc = document.getElementById('hero-desc').innerText;
            siteData.wa = document.getElementById('wa-input').value;
            siteData.qr = document.getElementById('qr-input').value;
            db.ref('siteData').set(siteData).then(() => alert("Saved Successfully!"));
        }

        function sendOrder() {
            const name = document.getElementById('cust-name').value;
            const addr = document.getElementById('cust-addr').value;
            if(!name || !addr || !cart.length) return alert("Fill all details!");
            let msg = `*NEW ORDER*%0A*Name:* ${name}%0A*Address:* ${addr}%0A%0A*Items:*%0A`;
            cart.forEach(item => msg += `• ${item.name} (${item.quantity} x ${item.price})%0A`);
            msg += `%0A*Total: Rs. ${document.getElementById('cart-total').innerText}*`;
            window.open(`https://wa.me/${siteData.wa}?text=${msg}`, '_blank');
        }

        function changeHeroImg() { const u = prompt("Img URL:"); if(u) { siteData.heroImg = u; applyDataToScreen(); } }
        function changeItemImg(i) { const u = prompt("Img URL:"); if(u) { siteData.menu[i].img = u; renderMenu(); } }
    </script>
</body>
</html>
